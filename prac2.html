<style>
  table {
    border-collapse: collapse;
    width: 60%;
  }
  th, td {
    border: 1px solid black;
    padding: 10px;
    text-align: center;
  }
  /* Even rows */
  tr:nth-child(even) {
    background-color: #f2f2f2;
  }
  /* Odd rows */
  tr:nth-child(odd) {
    background-color: #ffffff;
  }
  /* Header row */
  th {
    background-color: #333;
    color: white;
  }
</style>
<h2>Table with Odd & Even Row Colors</h2>
<table>
  <tr>
    <th>Roll No</th>
    <th>Name</th>
    <th>Course</th>
